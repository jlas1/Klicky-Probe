###################
# Bed mesh calibrate
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
description: Perform Mesh Bed Leveling with klicky automount
gcode:
    {% set V = printer["gcode_macro _User_Variables"].verbose %}
    {% set bedmesh_faster = printer["gcode_macro _User_Variables"].bedmesh_faster|default(False) %}
    {% set bedmesh_hmove = printer["gcode_macro _User_Variables"].bedmesh_hmove|default(3) %}
    {% set bedmesh_adaptive = printer["gcode_macro _User_Variables"].bedmesh_adaptive|default(False) %}

    {% set adjusted_z = printer.configfile.config["probe"]["z_offset"] | int + bedmesh_hmove %}

    {% if V %}
        { action_respond_info("Bed Mesh Calibrate") }
    {% endif %}

    _CheckProbe action=query
    G90
    Attach_Probe
    _KLICKY_STATUS_MESHING


    {% if bedmesh_faster %}
        _KlickyDebug msg="BedMesh faster enabled"
        {% if ("z_tilt" in printer and printer.z_tilt.applied) or ("quad_gantry_level" in printer and printer.quad_gantry_level.applied) %}
            _KlickyDebug msg="BedMesh BED already level, using faster bed mesh"
            _BED_MESH_CALIBRATE HORIZONTAL_MOVE_Z={adjusted_z} ADAPTIVE={ 1 if bedmesh_adaptive else 0 }
        {% else %}
            _KlickyDebug msg="BedMesh BED not level, using normal bed mesh"
            _BED_MESH_CALIBRATE  ADAPTIVE={ 1 if bedmesh_adaptive else 0 }
        {% endif %}
    {% else %}
        _KlickyDebug msg="BedMesh faster disabled"
        _BED_MESH_CALIBRATE {rawparams}
    {% endif %}

    Dock_Probe

