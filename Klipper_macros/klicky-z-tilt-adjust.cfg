###################
## Z Tilt Adjust
[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
description:
gcode:
    {% set V = printer["gcode_macro _User_Variables"].verbose %}
    {% set level_faster = printer["gcode_macro _User_Variables"].level_faster|default(False) %}
    {% set level_tolerance = printer["gcode_macro _User_Variables"].level_tolerance|default(1) %}
    {% set level_hmove = printer["gcode_macro _User_Variables"].level_hmove|default(3)|int %}

    {% set adjusted_z = printer.configfile.config["probe"]["z_offset"] | int + level_hmove %}

    {% if V %}
        { action_respond_info("Z Tilt Adjust") }
    {% endif %}

    _CheckProbe action=query
	G90
    Attach_Probe
    _KLICKY_STATUS_LEVELING

    {% if level_faster %}
        _KlickyDebug msg="Ztilt faster enabled"
        {% if "z_tilt" in printer and printer.z_tilt.applied %}
            _KlickyDebug msg="Ztilt Z_TILT already run, going directly to second pass"
        {% else %}
            _Z_TILT_ADJUST RETRY_TOLERANCE={level_tolerance}
        {% endif %}
        _Z_TILT_ADJUST HORIZONTAL_MOVE_Z={adjusted_z}
    {% else %}
        _KlickyDebug msg="Ztilt faster disabled"
        _Z_TILT_ADJUST 
    {% endif %}

    {% if not 'z_virtual_endstop' in printer['configfile'].config["stepper_z"]["endstop_pin"] %}    
        _KlickyDebug msg="Ztilt standard z endstop detected, docking probe"
        Dock_Probe
    {% endif %}
    _KlickyDebug msg="Ztilt faster Z homing"
    G28 Z0
    {% if 'z_virtual_endstop' in printer['configfile'].config["stepper_z"]["endstop_pin"] %}    
        _KlickyDebug msg="Ztilt virtual z endstop detected, docking probe"
        Dock_Probe
    {% endif %}
