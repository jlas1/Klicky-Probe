###################
## Z Tilt Adjust
[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
description:
gcode:
    {% set V = printer["gcode_macro _User_Variables"].verbose %}
    {% set ztilt_faster = printer["gcode_macro _User_Variables"].ztilt_faster|default(False) %}
    {% set ztilt_tolerance = printer["gcode_macro _User_Variables"].ztilt_tolerance|default(1) %}
    {% set ztilt_hmove = printer["gcode_macro _User_Variables"].ztilt_hmove|default(3)|int %}
    {% set travel_speed = printer["gcode_macro _User_Variables"].travel_speed %}
    {% set move_accel = printer["gcode_macro _User_Variables"].move_accel|default(1000) %}  	

    {% set adjusted_z = printer.configfile.config["probe"]["z_offset"] | int + ztilt_hmove %}

    {% if V %}
        { action_respond_info("Z Tilt Adjust") }
    {% endif %}

    _entry_point function=Z_TILT_ADJUST
    _CheckProbe action=query
    G90
    Attach_Probe
    SET_VELOCITY_LIMIT ACCEL={move_accel}
    SET_VELOCITY_LIMIT VELOCITY={travel_speed}
    _KLICKY_STATUS_LEVELING

    {% if ztilt_faster %}
        _KlickyDebug msg="Ztilt faster enabled"
        {% if "z_tilt" in printer and printer.z_tilt.applied %}
            _KlickyDebug msg="Ztilt Z_TILT already run, going directly to second pass"
        {% else %}
            _Z_TILT_ADJUST RETRY_TOLERANCE={ztilt_tolerance}
        {% endif %}
        _Z_TILT_ADJUST HORIZONTAL_MOVE_Z={adjusted_z}
    {% else %}
        _KlickyDebug msg="Ztilt faster disabled"
        _Z_TILT_ADJUST 
    {% endif %}

    {% if not 'z_virtual_endstop' in printer['configfile'].config["stepper_z"]["endstop_pin"] %}    
        _KlickyDebug msg="Ztilt standard z endstop detected, docking probe"
        Dock_Probe
    {% endif %}
    _KlickyDebug msg="Ztilt faster Z homing"
    G28 Z0
    {% if 'z_virtual_endstop' in printer['configfile'].config["stepper_z"]["endstop_pin"] %}    
        _KlickyDebug msg="Ztilt virtual z endstop detected, docking probe"
        Dock_Probe
    {% endif %}
    _exit_point function=Z_TILT_ADJUST
